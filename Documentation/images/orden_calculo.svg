<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Seis razones para ordenar el cálculo del pedido</title>
<desc id="desc">Combo antes de escala para evitar beneficios duplicados; ajustes con origen; desglose explicable; impuestos después de descuentos; crédito sobre el total; snapshot completo para confirmar sin recalcular. Los ejemplos de unidades y montos son ilustrativos.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#edf8fc"/><stop offset="1" stop-color="#F5F7F8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#00A6A6"/></marker></defs>
<rect width="1200" height="1500" fill="white"/><rect x="20" y="20" width="1160" height="1460" rx="22" fill="url(#bg)" stroke="#bfdde9"/><g font-family="Arial, sans-serif" fill="#123B5D"><text x="55" y="66" font-size="17" font-weight="700" fill="#00A6A6" text-anchor="start">MARIPOSAMARKET  /  REGLAS DE PRECIO</text><text x="55" y="115" font-size="39" font-weight="700" fill="#123B5D" text-anchor="start">El orden del cálculo protege el pedido</text><text x="55" y="154" font-size="23" font-weight="400" fill="#123B5D" text-anchor="start">Cada paso deja preparado el siguiente: un precio explicable y consistente.</text><rect x="55" y="190" width="166" height="62" rx="12" fill="#e2f5f3" stroke="#9fd8d3"/><text x="138" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">01</text><text x="138" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Combos</text><path d="M223 221h13" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="239" y="190" width="166" height="62" rx="12" fill="#e2f5f3" stroke="#9fd8d3"/><text x="322" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">02</text><text x="322" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Escala</text><path d="M407 221h13" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="423" y="190" width="166" height="62" rx="12" fill="#e2f5f3" stroke="#9fd8d3"/><text x="506" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">03</text><text x="506" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Obsequios</text><path d="M591 221h13" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="607" y="190" width="166" height="62" rx="12" fill="#e2f5f3" stroke="#9fd8d3"/><text x="690" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">04</text><text x="690" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Impuestos</text><path d="M775 221h13" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="791" y="190" width="166" height="62" rx="12" fill="#e2f5f3" stroke="#9fd8d3"/><text x="874" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">05</text><text x="874" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Total / crédito</text><path d="M959 221h13" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><rect x="975" y="190" width="166" height="62" rx="12" fill="#fff3c9" stroke="#e6bf43"/><text x="1058" y="213" font-size="14" font-weight="700" fill="#00A6A6" text-anchor="middle">06</text><text x="1058" y="238" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Snapshot</text><rect x="55" y="282" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="75" y="302" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="96" y="331" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text><text x="131" y="329" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Evitar beneficios duplicados</text><text x="75" y="372" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">El combo asigna unidades antes de la escala.</text><text x="80" y="413" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Ejemplo: 6 unidades elegibles</text><rect x="80" y="430" width="282" height="103" rx="12" fill="#e5f6f4" stroke="#9edbd5"/><rect x="380" y="430" width="178" height="103" rx="12" fill="#eaf1ff" stroke="#b5caee"/><rect x="104" y="449" width="27" height="32" rx="5" fill="#00A6A6" stroke="#00A6A6"/><path d="M111 458h13" stroke="white" stroke-width="3"/><rect x="163" y="449" width="27" height="32" rx="5" fill="#00A6A6" stroke="#00A6A6"/><path d="M170 458h13" stroke="white" stroke-width="3"/><rect x="222" y="449" width="27" height="32" rx="5" fill="#00A6A6" stroke="#00A6A6"/><path d="M229 458h13" stroke="white" stroke-width="3"/><rect x="281" y="449" width="27" height="32" rx="5" fill="#00A6A6" stroke="#00A6A6"/><path d="M288 458h13" stroke="white" stroke-width="3"/><rect x="416" y="449" width="27" height="32" rx="5" fill="#527db5" stroke="#527db5"/><path d="M423 458h13" stroke="white" stroke-width="3"/><rect x="481" y="449" width="27" height="32" rx="5" fill="#527db5" stroke="#527db5"/><path d="M488 458h13" stroke="white" stroke-width="3"/><text x="221" y="514" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">4 asignadas al combo</text><text x="469" y="514" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">2 restantes</text><text x="80" y="565" font-size="20" font-weight="400" fill="#123B5D" text-anchor="start">La escala evalúa las restantes, si cumplen</text><text x="80" y="592" font-size="20" font-weight="400" fill="#123B5D" text-anchor="start">su regla. Sin duplicar beneficios por defecto.</text><rect x="615" y="282" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="635" y="302" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="656" y="331" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text><text x="691" y="329" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Conservar el origen</text><text x="635" y="372" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Cada ajuste deja una ficha comercial legible.</text><rect x="640" y="405" width="480" height="181" rx="12" fill="#f5faff" stroke="#bcd7e8"/><text x="660" y="438" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Promoción</text><text x="835" y="438" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">COMBO-01</text><text x="660" y="477" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Tipo / origen</text><text x="835" y="477" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Combo / campaña</text><text x="660" y="516" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Unidades</text><text x="835" y="516" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">4 unidades asignadas</text><text x="660" y="555" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Monto</text><text x="835" y="555" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Descuento aplicado</text><text x="640" y="612" font-size="20" font-weight="400" fill="#123B5D" text-anchor="start">El beneficio puede explicarse y auditarse.</text><rect x="55" y="652" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="75" y="672" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="96" y="701" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text><text x="131" y="699" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Explicar el precio</text><text x="75" y="742" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">El resumen conserva el desglose del cálculo.</text><rect x="80" y="773" width="300" height="183" rx="12" fill="#f9fcfd" stroke="#c9dde5"/><text x="96" y="804" font-size="17" font-weight="400" fill="#123B5D" text-anchor="start">Precio base</text><text x="362" y="804" font-size="20" font-weight="700" fill="#123B5D" text-anchor="end">100</text><text x="96" y="845" font-size="17" font-weight="400" fill="#123B5D" text-anchor="start">− Beneficios comerciales</text><text x="362" y="845" font-size="20" font-weight="700" fill="#123B5D" text-anchor="end">− 10</text><text x="96" y="886" font-size="17" font-weight="400" fill="#123B5D" text-anchor="start">+ Impuestos ilustrativos</text><text x="362" y="886" font-size="20" font-weight="700" fill="#123B5D" text-anchor="end">+ 9</text><text x="96" y="927" font-size="17" font-weight="700" fill="#123B5D" text-anchor="start">Total</text><text x="362" y="927" font-size="20" font-weight="700" fill="#123B5D" text-anchor="end">99</text><rect x="398" y="801" width="160" height="113" rx="12" fill="#fff5d2" stroke="#e7c96b"/><text x="478" y="833" font-size="16" font-weight="700" fill="#123B5D" text-anchor="middle">OBSEQUIOS</text><text x="478" y="867" font-size="23" font-weight="700" fill="#123B5D" text-anchor="middle">+ 1 unidad</text><text x="478" y="896" font-size="16" font-weight="400" fill="#123B5D" text-anchor="middle">Cantidad visible</text><text x="80" y="981" font-size="17" font-weight="400" fill="#123B5D" text-anchor="start">Montos y obsequio ilustrativos; no son una tarifa.</text><rect x="615" y="652" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="635" y="672" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="656" y="701" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text><text x="691" y="699" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Gravar la base correcta</text><text x="635" y="742" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Primero descuentos, después impuestos.</text><rect x="640" y="782" width="138" height="78" rx="12" fill="#eaf1ff" stroke="#c9dde5"/><rect x="806" y="782" width="138" height="78" rx="12" fill="#e5f6f4" stroke="#c9dde5"/><rect x="972" y="782" width="148" height="78" rx="12" fill="#fff5d2" stroke="#e7c96b"/><text x="709" y="812" font-size="17" font-weight="700" fill="#123B5D" text-anchor="middle">Precio base</text><text x="709" y="844" font-size="26" font-weight="700" fill="#123B5D" text-anchor="middle">100</text><text x="792" y="832" font-size="27" font-weight="700" fill="#123B5D" text-anchor="start">−</text><text x="875" y="812" font-size="17" font-weight="700" fill="#123B5D" text-anchor="middle">Descuentos</text><text x="875" y="844" font-size="26" font-weight="700" fill="#123B5D" text-anchor="middle">10</text><text x="951" y="832" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">=</text><text x="1046" y="812" font-size="17" font-weight="700" fill="#123B5D" text-anchor="middle">Base gravable</text><text x="1046" y="844" font-size="26" font-weight="700" fill="#123B5D" text-anchor="middle">90</text><path d="M1046 865v30" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="925" font-size="23" font-weight="700" fill="#123B5D" text-anchor="start">Impuesto = 90 × tasa configurada</text><text x="640" y="964" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">La base refleja el precio después del beneficio.</text><rect x="55" y="1022" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="75" y="1042" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="96" y="1071" font-size="22" font-weight="700" fill="white" text-anchor="middle">5</text><text x="131" y="1069" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Evaluar el cupo real</text><text x="75" y="1112" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">En una compra a crédito se compara el total.</text><text x="80" y="1161" font-size="19" font-weight="700" fill="#123B5D" text-anchor="start">Cupo disponible</text><rect x="80" y="1177" width="470" height="36" rx="8" fill="#e7eef1" stroke="#e7eef1"/><rect x="80" y="1177" width="388" height="36" rx="8" fill="#00A6A6" stroke="#00A6A6"/><text x="535" y="1202" font-size="19" font-weight="700" fill="#123B5D" text-anchor="end">120</text><text x="80" y="1243" font-size="23" font-weight="700" fill="#123B5D" text-anchor="start">Pedido: 99 de 120</text><text x="80" y="1280" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Incluye impuestos y descuentos definitivos.</text><text x="80" y="1318" font-size="20" font-weight="400" fill="#123B5D" text-anchor="start">Al confirmar se valida y reserva el cupo.</text><text x="80" y="1349" font-size="17" font-weight="400" fill="#123B5D" text-anchor="start">Ejemplo ilustrativo de un pedido con crédito.</text><rect x="615" y="1022" width="530" height="350" rx="12" fill="#fff" stroke="#c9dde5"/><rect x="635" y="1042" width="42" height="42" rx="21" fill="#123B5D" stroke="#123B5D"/><text x="656" y="1071" font-size="22" font-weight="700" fill="white" text-anchor="middle">6</text><text x="691" y="1069" font-size="25" font-weight="700" fill="#123B5D" text-anchor="start">Respetar Quote = Order</text><text x="635" y="1112" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">El snapshot se guarda al terminar el cálculo.</text><rect x="640" y="1149" width="207" height="117" rx="12" fill="#eaf1ff" stroke="#b5caee"/><rect x="913" y="1149" width="207" height="117" rx="12" fill="#e5f6f4" stroke="#9edbd5"/><text x="743" y="1183" font-size="21" font-weight="700" fill="#123B5D" text-anchor="middle">QUOTE</text><text x="743" y="1216" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Snapshot completo</text><text x="743" y="1246" font-size="22" font-weight="700" fill="#123B5D" text-anchor="middle">Total: 99</text><path d="M853 1207h52" fill="none" stroke="#00A6A6" stroke-width="3" marker-end="url(#arrow)"/><text x="1016" y="1183" font-size="21" font-weight="700" fill="#123B5D" text-anchor="middle">ORDER</text><text x="1016" y="1216" font-size="18" font-weight="700" fill="#123B5D" text-anchor="middle">Mismo desglose</text><text x="1016" y="1246" font-size="22" font-weight="700" fill="#123B5D" text-anchor="middle">Total: 99</text><text x="640" y="1310" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Confirmar sin recalcular precios ni promociones.</text><text x="640" y="1344" font-size="19" font-weight="400" fill="#123B5D" text-anchor="start">Una cotización válida conserva lo mostrado.</text><rect x="55" y="1400" width="1090" height="52" rx="12" fill="#123B5D" stroke="#123B5D"/><text x="600" y="1433" font-size="23" font-weight="700" fill="white" text-anchor="middle">Beneficios claros  →  total definitivo  →  pedido consistente</text></g></svg>
