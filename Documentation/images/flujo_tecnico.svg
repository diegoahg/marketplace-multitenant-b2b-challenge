<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="800" viewBox="0 0 1560 800" role="img" aria-labelledby="title desc"><title id="title">Flujo técnico de MariposaMarket</title><desc id="desc">Cotización en Go, snapshot MongoDB, confirmación transaccional y envío asíncrono mediante outbox, Pub/Sub y worker hacia ERP y PUSH.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#123B5D" flood-opacity="0.08"/></filter></defs><rect width="1560" height="800" fill="white"/><g font-family="Arial, sans-serif" fill="#101b46"><text x="780" y="65" text-anchor="middle" font-size="42" font-weight="700">Flujo técnico de la aplicación</text><text x="780" y="108" text-anchor="middle" font-size="25">MariposaMarket · Cotizar, confirmar y propagar</text><rect x="30" y="190" width="220" height="475" rx="22" fill="white" stroke="#12a653" filter="url(#shadow)"/><circle cx="140" cy="190" r="25" fill="#12a653"/><text x="140" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">01</text><circle cx="140" cy="270" r="36" fill="#12a653"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="118" y="254" width="44" height="28" rx="3"/><path d="M140 282v9m-16 0h32"/></g><text x="140" y="334" text-anchor="middle" font-weight="700" font-size="22">Cliente / Flutter</text><rect x="42" y="355" width="196" height="62" rx="12" fill="#12a653" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="140" y="392">Catálogo y carrito</tspan></text><rect x="42" y="427" width="196" height="62" rx="12" fill="#12a653" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="140" y="464">POST /quotes</tspan></text><rect x="42" y="499" width="196" height="62" rx="12" fill="#12a653" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="140" y="536">Revisar desglose</tspan></text><rect x="42" y="571" width="196" height="62" rx="12" fill="#12a653" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="140" y="596">POST /orders</tspan><tspan x="140" y="619">Idempotency-Key</tspan></text><path d="M256 440h23m-8-8 8 8-8 8" fill="none" stroke="#12a653" stroke-width="3" stroke-linecap="round"/><rect x="285" y="190" width="220" height="475" rx="22" fill="white" stroke="#1674ed" filter="url(#shadow)"/><circle cx="395" cy="190" r="25" fill="#1674ed"/><text x="395" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">02</text><circle cx="395" cy="270" r="36" fill="#1674ed"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M383 257l-12 13 12 13m24-26 12 13-12 13m-8-31-8 36"/></g><text x="395" y="334" text-anchor="middle" font-weight="700" font-size="22">API Go + Pricing</text><rect x="297" y="355" width="196" height="62" rx="12" fill="#1674ed" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="395" y="392">Validar contexto</tspan></text><rect x="297" y="427" width="196" height="62" rx="12" fill="#1674ed" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="395" y="452">COMBO → SCALE</tspan><tspan x="395" y="475">→ GIFT → impuestos</tspan></text><rect x="297" y="499" width="196" height="62" rx="12" fill="#1674ed" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="395" y="536">Evaluar crédito</tspan></text><rect x="297" y="571" width="196" height="62" rx="12" fill="#1674ed" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="395" y="596">Persistir snapshot</tspan><tspan x="395" y="619">de la cotización</tspan></text><path d="M511 440h23m-8-8 8 8-8 8" fill="none" stroke="#1674ed" stroke-width="3" stroke-linecap="round"/><rect x="540" y="190" width="220" height="475" rx="22" fill="white" stroke="#8046df" filter="url(#shadow)"/><circle cx="650" cy="190" r="25" fill="#8046df"/><text x="650" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">03</text><circle cx="650" cy="270" r="36" fill="#8046df"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="650" cy="253" rx="21" ry="7"/><path d="M629 253v31c0 10 42 10 42 0v-31m-42 15c0 10 42 10 42 0"/></g><text x="650" y="334" text-anchor="middle" font-weight="700" font-size="22">MongoDB</text><rect x="552" y="355" width="196" height="62" rx="12" fill="#8046df" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="650" y="392">Quote original</tspan></text><rect x="552" y="427" width="196" height="62" rx="12" fill="#8046df" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="650" y="464">Precios y reglas</tspan></text><rect x="552" y="499" width="196" height="62" rx="12" fill="#8046df" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="650" y="536">Saldo de crédito</tspan></text><rect x="552" y="571" width="196" height="62" rx="12" fill="#8046df" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="650" y="596">Snapshot consultable</tspan><tspan x="650" y="619">GET /quotes/{id}</tspan></text><path d="M766 440h23m-8-8 8 8-8 8" fill="none" stroke="#8046df" stroke-width="3" stroke-linecap="round"/><rect x="795" y="190" width="220" height="475" rx="22" fill="white" stroke="#ef8b00" filter="url(#shadow)"/><circle cx="905" cy="190" r="25" fill="#ef8b00"/><text x="905" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">04</text><circle cx="905" cy="270" r="36" fill="#ef8b00"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M885 269l14 14 28-28"/></g><text x="905" y="334" text-anchor="middle" font-weight="700" font-size="22">Confirmación</text><rect x="807" y="355" width="196" height="62" rx="12" fill="#ef8b00" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="905" y="392">Sin recalcular precios</tspan></text><rect x="807" y="427" width="196" height="62" rx="12" fill="#ef8b00" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="905" y="464">Transacción MongoDB</tspan></text><rect x="807" y="499" width="196" height="62" rx="12" fill="#ef8b00" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="905" y="524">Pedido + crédito</tspan><tspan x="905" y="547">+ clave + outbox</tspan></text><rect x="807" y="571" width="196" height="62" rx="12" fill="#ef8b00" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="905" y="608">Commit → HTTP 201</tspan></text><path d="M1021 440h23m-8-8 8 8-8 8" fill="none" stroke="#ef8b00" stroke-width="3" stroke-linecap="round"/><rect x="1050" y="190" width="220" height="475" rx="22" fill="white" stroke="#00a6a6" filter="url(#shadow)"/><circle cx="1160" cy="190" r="25" fill="#00a6a6"/><text x="1160" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">05</text><circle cx="1160" cy="270" r="36" fill="#00a6a6"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="1141" cy="270" r="6"/><circle cx="1177" cy="251" r="6"/><circle cx="1177" cy="289" r="6"/><path d="M1147 267l24-13m-24 19 24 13"/></g><text x="1160" y="334" text-anchor="middle" font-weight="700" font-size="22">Outbox + Pub/Sub</text><rect x="1062" y="355" width="196" height="62" rx="12" fill="#00a6a6" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1160" y="392">Publisher del worker</tspan></text><rect x="1062" y="427" width="196" height="62" rx="12" fill="#00a6a6" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1160" y="452">Publicar evento</tspan><tspan x="1160" y="475">OrderConfirmed</tspan></text><rect x="1062" y="499" width="196" height="62" rx="12" fill="#00a6a6" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1160" y="536">Entrega al worker</tspan></text><rect x="1062" y="571" width="196" height="62" rx="12" fill="#00a6a6" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1160" y="596">Reconciliar pendientes</tspan><tspan x="1160" y="619">con el mismo eventId</tspan></text><path d="M1276 440h23m-8-8 8 8-8 8" fill="none" stroke="#00a6a6" stroke-width="3" stroke-linecap="round"/><rect x="1305" y="190" width="220" height="475" rx="22" fill="white" stroke="#15983f" filter="url(#shadow)"/><circle cx="1415" cy="190" r="25" fill="#15983f"/><text x="1415" y="198" text-anchor="middle" font-size="23" fill="white" font-weight="700">06</text><circle cx="1415" cy="270" r="36" fill="#15983f"/><g fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1396 270h38m-13-13 13 13-13 13"/></g><text x="1415" y="334" text-anchor="middle" font-weight="700" font-size="22">Worker Go</text><rect x="1317" y="355" width="196" height="62" rx="12" fill="#15983f" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1415" y="392">Consumir evento</tspan></text><rect x="1317" y="427" width="196" height="62" rx="12" fill="#15983f" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1415" y="452">ERP + PUSH</tspan><tspan x="1415" y="475">por adaptadores</tspan></text><rect x="1317" y="499" width="196" height="62" rx="12" fill="#15983f" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1415" y="536">Deduplicar por destino</tspan></text><rect x="1317" y="571" width="196" height="62" rx="12" fill="#15983f" fill-opacity="0.08"/><text text-anchor="middle" font-size="17"><tspan x="1415" y="596">Guardar progreso</tspan><tspan x="1415" y="619">y ack / reintentar</tspan></text><rect x="30" y="705" width="1500" height="60" rx="16" fill="#f0f7fb"/><text x="780" y="743" text-anchor="middle" font-size="21">Precio cotizado = precio confirmado · Persistir antes de responder · Entrega asíncrona con reintentos</text></g></svg>