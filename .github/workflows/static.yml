# Simple workflow for deploying static content to GitHub Pages
name: Deploy HTML documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
    paths:
      - "Documentation/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Deploy the ready-to-serve HTML documentation
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify site entry point
        run: |
          test -s Documentation/index.html
          test -s Documentation/adr.html
          test -s Documentation/ADR.pdf
          test -s Documentation/dominio.html
          test -s Documentation/casos.html
          test -s Documentation/revision-final.html
          test -s Documentation/images/arquitectura.svg
          test -s Documentation/images/orden_calculo.svg
          test -s Documentation/images/orden_calculo.png
          test -s Documentation/images/worker_delivery.svg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the generated website
          path: './Documentation'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
