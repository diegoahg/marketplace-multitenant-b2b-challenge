name: CI - tests, quality and security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Go syntax and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build test image
        run: docker compose --profile test build tests
      - name: Formatting and static analysis
        run: |
          docker compose --profile test run --no-deps --rm tests sh -ec '
            files=$(gofmt -l .)
            if [ -n "$files" ]; then printf "%s\n" "$files"; exit 1; fi
            go vet -tags=integration ./...
            sh scripts/test-download-go-modules.sh
          '
      - name: Start integration dependencies
        run: docker compose up -d --wait --wait-timeout 180 mongo pubsub-emulator
      - name: Unit, golden and integration tests with race detector
        run: docker compose --profile test run --no-deps --rm tests
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/backend-services.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: backend-failure
          path: reports/
          retention-days: 7
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Flutter syntax and golden tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned Flutter test image
        run: docker compose --profile frontend-test build frontend-tests
      - name: Check Dart formatting
        run: docker compose --profile frontend-test run --no-deps --rm frontend-tests dart format --output=none --set-exit-if-changed lib test
      - name: Analyzer and tests (never update goldens in CI)
        run: |
          mkdir -p frontend/test/failures
          docker compose --profile frontend-test run --no-deps --rm \
            -v "$PWD/frontend/test/failures:/app/test/failures" frontend-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: flutter-golden-failures
          path: frontend/test/failures/
          if-no-files-found: ignore
          retention-days: 7

  complexity:
    name: Go and Dart complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Go quality tools
        run: docker build -t marketplace-ci-tools -f ci/Dockerfile .
      - name: Go cyclomatic complexity (maximum 20)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" marketplace-ci-tools gocyclo -over 20 -ignore '_test.go' backend | tee reports/go-complexity.log
      - name: Build Flutter quality image
        if: ${{ !cancelled() }}
        run: docker build --target sdk -t marketplace-flutter-sdk frontend
      - name: Dart cyclomatic complexity (maximum 20)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD/frontend:/app" marketplace-flutter-sdk sh -ec '
            flutter pub get
            dart pub global activate dart_code_linter 4.3.0
            dart pub global run dart_code_linter:metrics analyze lib --set-exit-on-violation-level=warning --fatal-warnings --fatal-performance
          ' | tee reports/dart-complexity.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: complexity-reports
          path: reports/
          retention-days: 7

  security:
    name: Security and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build security tools
        run: docker build -t marketplace-ci-tools -f ci/Dockerfile .
      - name: Validate GitHub Actions syntax and expressions
        run: docker run --rm -v "$PWD:/repo:ro" marketplace-ci-tools actionlint -color
      - name: Go security source analysis
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" -w /repo/backend marketplace-ci-tools gosec -severity medium -confidence medium ./... | tee reports/gosec.log
      - name: Dependency vulnerabilities and exposed secrets
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" -w /repo aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs --config ci/trivy.yaml --include-dev-deps . | tee reports/trivy.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 7

  browser:
    name: Chrome end-to-end in Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build application
        run: |
          mkdir -p reports
          docker compose --progress plain build 2>&1 | tee reports/browser-build.log
      - name: Start application
        run: |
          docker compose up --no-build -d
          for attempt in {1..90}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://localhost:3000/api/ready; then exit 0; fi
            sleep 2
          done
          docker compose ps --all
          echo "Application readiness timed out" >&2
          exit 1
      - name: Install browser test dependencies
        # The smoke test below uses Node and the real independent Compose services.
        working-directory: frontend
        run: |
          npm ci
          node --check ../scripts/test.mjs
          node --check playwright.config.js
          node --check e2e/shop.spec.js
          npx playwright install --with-deps chrome
      - name: Test release against real API
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify independent worker and outbox recovery
        run: node backend/scripts/worker-smoke.mjs
      - name: Verify destination retries, DLQ and email
        run: node backend/scripts/dlq-smoke.mjs
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/browser-services.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: |
            frontend/test-results/
            reports/
          retention-days: 7
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci:
    name: CI required
    needs: [backend, frontend, complexity, security, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
