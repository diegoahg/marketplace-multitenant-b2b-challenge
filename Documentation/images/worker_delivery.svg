<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Worker: dos suscripciones, reintentos y DLQ</title><desc id="desc">Un tópico orders-confirmed entrega a ERP y PUSH por suscripciones independientes. Cada acción dummy confirma su propio mensaje. Un fallo no hace ACK, se reintenta cinco veces con espera exponencial y, si persiste, pasa a una DLQ durable en MongoDB antes del ACK. Un bucle envía el correo a Mailpit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#123B5D"/></marker></defs>
<rect width="1200" height="710" fill="white"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#101b46">
<text x="600" y="48" font-size="31" font-weight="700">Un evento, dos destinos independientes</text>
<text x="600" y="82" font-size="19">Worker · progreso persistido por evento y destino</text>
<rect x="390" y="110" width="420" height="65" rx="16" fill="#eff5ff" stroke="#1674ed"/>
<text x="600" y="137" font-size="18" font-weight="700">Tópico de confirmación</text><text x="600" y="161" font-size="18">orders-confirmed</text>
<g fill="none" stroke="#123B5D" stroke-width="2" marker-end="url(#arrow)"><path d="M600 175v20H295v25"/><path d="M600 195h305v25"/></g>
<rect x="65" y="222" width="460" height="115" rx="18" fill="#f3edfc" stroke="#8046df"/>
<text x="295" y="252" font-size="20" font-weight="700">orders-confirmed-erp</text><text x="295" y="281" font-size="19">Acción dummy ERP</text><text x="295" y="312" font-size="17">Éxito → guardar progreso → ACK de ERP</text>
<rect x="675" y="222" width="460" height="115" rx="18" fill="#eaf8f6" stroke="#00a6a6"/>
<text x="905" y="252" font-size="20" font-weight="700">orders-confirmed-push</text><text x="905" y="281" font-size="19">Acción dummy PUSH</text><text x="905" y="312" font-size="17">Éxito → guardar progreso → ACK de PUSH</text>
<g fill="none" stroke="#123B5D" stroke-width="2" marker-end="url(#arrow)"><path d="M295 337v39"/><path d="M905 337v39"/></g>
<rect x="65" y="380" width="1070" height="85" rx="18" fill="#fff7ec" stroke="#ef8b00"/>
<text x="600" y="410" font-size="20" font-weight="700">Fallo: sin ACK · aplazar entrega · persistir contador y fecha</text>
<text x="600" y="440" font-size="19">Por destino: intento inicial + 5 reintentos · 1 → 2 → 4 → 8 → 16 segundos</text>
<path d="M600 465v20H325v15" fill="none" stroke="#123B5D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="505" width="520" height="105" rx="18" fill="#fff3f0" stroke="#bd543c"/>
<text x="325" y="535" font-size="20" font-weight="700">Sexto fallo → DLQ durable en MongoDB</text><text x="325" y="566" font-size="18">dead_letters + destino terminal en transacción</text><text x="325" y="590" font-size="17">Después del commit: ACK del mensaje fuente</text>
<path d="M590 558h60" fill="none" stroke="#123B5D" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="505" width="475" height="105" rx="18" fill="#eef9ef" stroke="#15983f"/>
<text x="897" y="535" font-size="20" font-weight="700">Correo de alerta → Mailpit</text><text x="897" y="566" font-size="18">Pedido · evento · destino · causa · intentos</text><text x="897" y="590" font-size="17">SMTP fallido: conservar y reintentar en 30 s</text>
<rect x="65" y="645" width="1070" height="40" rx="12" fill="#f0f7fb"/><text x="600" y="671" font-size="17">ERP no bloquea PUSH · Reiniciar no reinicia los reintentos · La DLQ conserva la evidencia</text>
</g></svg>
